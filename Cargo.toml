[package]
name = "scenario-weaver"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "scenario-weaver"
path = "src/main.rs"

[lib]
name = "scenario_weaver"
path = "src/lib.rs"

[dependencies]
# Z3 SMT Solver - core constraint solving
# Using system Z3 library instead of static linking
z3 = "0.19"

# Serialization - YAML input, JSON output
serde = { version = "1.0", features = ["derive"] }
serde_yml = "0.0.12"
serde_json = "1.0"

# Utilities
chrono = { version = "0.4", features = ["serde"] }     # Timestamps
uuid = { version = "1.6", features = ["v4", "serde"] } # Scenario IDs
anyhow = "1.0"                                         # Error handling convenience
thiserror = "2.0"                                      # Custom error types

# CLI (will be used in Phase 12)
clap = { version = "4.4", features = ["derive"] }

# Logging (will be used in Phase 12)
tracing = "0.1"
tracing-subscriber = "0.3"

# SVG visualization
svg = "0.18"

# GIF animation
image = "0.25"     # Image manipulation
gif = "0.14"       # GIF encoding
imageproc = "0.26" # Text rendering
ab_glyph = "0.2"   # Font loading (compatible with imageproc)

# OpenDRIVE (.xodr) road network export
opendrive = "0.1"
vec1 = "1.8"
uom = { version = "0.32", features = ["f64"] }
# openscenario-rs: intentionally a PATH dependency for now (SW-01/D1).
#
# scenario-weaver and openscenario-rs are being developed and tested together:
# commit a86466c adapted `xosc_exporter.rs` to unreleased local changes (CatalogLocations
# and RoadNetwork became required), so the published 0.3.2 will not build this crate.
#
# Consequence, accepted deliberately: `Cargo.lock` cannot pin a path dependency (no
# `source`, no `checksum`), so this tree is not reproducible off this machine and there
# is no cloud CI (see `scripts/check.sh` for the local gate that replaces it).
#
# EXIT: publish openscenario-rs 0.3.3, then restore the version dependency below,
# regenerate Cargo.lock, and only then merge to `main`. A path dependency must not
# reach `main`.
# openscenario-rs = { version = "0.3.3", features = ["builder"] }
openscenario-rs = { path = "../../Workspace_OpenScenario-rs/main", features = [
    "builder",
] }

[dev-dependencies]
tempfile = "3.8"          # Temporary files for testing
# SW-05: XSD-validate emitted .xosc against the bundled OpenSCENARIO schema.
# Already resolved transitively (openscenario-rs depends on it unconditionally),
# so this adds no new native build.
libxml = "0.3"
# SW-05: parse emitted .svg (and, in export_coverage_test.rs, sanity-check
# .xosc/.xodr structure) without inventing another XML crate — quick-xml is
# already resolved transitively via openscenario-rs.
quick-xml = "0.38"

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
# Enable useful lint groups
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Warn on problematic patterns (not deny, to avoid blocking existing code)
unwrap_used = "warn"
expect_used = "warn"

# Allow reasonable exceptions from pedantic
module_name_repetitions = "allow"
too_many_lines = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
struct_excessive_bools = "allow"
similar_names = "allow"
if_not_else = "allow"
doc_markdown = "allow"
uninlined_format_args = "allow"
redundant_closure_for_method_calls = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
