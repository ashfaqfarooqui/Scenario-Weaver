# ─── Scenario: Overtake Left ───
#
# NPC vehicle overtakes ego from behind using two sequential lane changes on a three-lane road.
#
# Actors:
#   - ego: lane 1 (middle), 14-16 m/s forward, fixed position at 50m
#   - npc: lane 1 (same as ego), 18-22 m/s forward, starts 15-25m behind ego
#
# Road: 3 lanes, 3.5m wide, all forward
# Coordinate System: cartesian
# Duration: 12.0s at 0.5s time steps
#
# Key Features:
#   - NPC performs left lane change at 2-3s (into passing lane 0)
#   - NPC accelerates past ego while in passing lane
#   - NPC performs right lane change at 7-8s (returns to lane 1, now ahead)
#   - Two sequential lane changes model a complete overtake maneuver
#
# Safety Constraints:
#   - min TTC: 2.0s (enforced)
#   - min distance: 4.0m (enforced)
#
# Run:
#   cargo run --release -- -i examples/overtake_left.yaml -o output/
#
scenario_type: overtake_left

# Time configuration
time_step: 0.5      # 0.5 second discretization
duration: 12.0      # 12 second scenario (longer to allow complete overtake)

# Road specification
road:
  num_lanes: 3
  lane_width: 3.5
  lane_directions: [1, 1, 1]  # All lanes go forward

# Actor specifications
actors:
  # Ego vehicle - cruising at constant speed
  - id: ego
    role: ego
    lane: 1            # Middle lane
    position: 50.0     # Fixed starting position
    speed: [14.0, 16.0]  # 14-16 m/s (~50-58 km/h)
    direction: 1
    acceleration: [-2.0, 1.0]  # Mild acceleration range

  # NPC vehicle - starts behind, overtakes using two lane changes
  - id: npc
    role: npc
    lane: 1            # Same lane as ego (starts behind)
    position: [25.0, 35.0]  # 15-25m behind ego
    speed: [18.0, 22.0]     # Faster than ego (to catch up)
    direction: 1
    acceleration: [-3.0, 4.0]  # Can accelerate to pass

    # Two sequential lane changes for overtake maneuver
    lane_changes:
      # First: move left into passing lane
      - direction: left
        start_time: [2.0, 3.0]    # Enter passing lane between 2-3s
        duration: [1.5, 2.0]      # Lane change takes 1.5-2 seconds
      # Second: move right back to original lane
      - direction: right
        start_time: [7.0, 8.0]    # Return to original lane between 7-8s
        duration: [1.5, 2.0]      # Lane change takes 1.5-2 seconds

# Lateral envelope.
#
# Until SW-09 `ay` was a free variable that no equation read, so this bound
# constrained nothing and the file solved at the 2.0 m/s2 default. Now that `ay`
# drives `vy`, the bound bites.
#
# SW-10 re-derived this number from scratch, as the SW-09 comment asked. The old
# note guessed it was "what a 3.5 m change in 1.5-2.0 s costs" and warned the
# figure might not survive. It does survive, but for a different reason: 3.0 is
# not an empirical fit, it is the exact minimum the discretisation admits.
#
#   `py` is pinned to a lane centre, with `vy = 0`, at the last step before the
#   change window and the first step after it. With time_step 0.5 s and the
#   window this file declares, those two pinned steps are 2.5 s apart -- five
#   intervals, four interior steps with a free `vy`.
#   Trapezoidal integration over those five intervals gives a lateral
#   displacement of 0.5 * (vy1 + vy2 + vy3 + vy4), which must equal one lane
#   width, 3.5 m, so vy1 + vy2 + vy3 + vy4 = 7.0.
#   The cartesian encoder caps |vy| at 2.0 m/s, so the two interior peaks
#   contribute at most 4.0 and the two ramp steps must supply the remaining 3.0
#   between them -- 1.5 m/s each, reached from vy = 0 in one 0.5 s step.
#   That is |ay| = 1.5 / 0.5 = 3.0 m/s2, and no profile does better.
#
# Bisected against the solver to confirm: UNSAT at 2.0, 2.5, 2.9 and 2.99,
# SAT at 3.0. The solved trajectory rides the bound exactly, with
# vy = 0, 1.5, 2.0, 2.0, 1.5, 0 across the window.
max_lateral_acceleration: 3.0

# Safety constraints
min_ttc: 2.0        # 2 second minimum time-to-collision
min_distance: 4.0   # 4 meter minimum distance

# Generation settings
num_scenarios: 1
