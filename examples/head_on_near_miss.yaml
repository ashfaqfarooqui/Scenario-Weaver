# ─── Scenario: Head-On Near Miss (Overtake) ───
#
# Ego overtakes a slow vehicle on a 2-lane bidirectional road, entering the
# oncoming lane. An oncoming NPC creates head-on risk, but safety constraints
# are enforced — the solver must find timing where ego completes the overtake
# before getting dangerously close to the oncoming vehicle.
#
# Actors:
#   - ego: lane 0, 12 m/s forward, starting at 0m
#         performs overtake: right lane change (lane 0 → 1), left lane change (lane 1 → 0)
#   - slow_npc: lane 0, 6-8 m/s forward, starting at 30-50m (ahead of ego)
#   - oncoming_npc: lane 1 (backward), 10-12 m/s, starting at 200-220m
#
# Road: 2 lanes, 3.5m wide, bidirectional [1, -1]
# Coordinate System: cartesian (default)
# Duration: 10.0s at 0.5s time steps
#
# Key Features:
#   - Ego overtakes slow vehicle by entering oncoming lane
#   - Must complete overtake before vehicles get too close
#   - Safety enforced for ALL pairs (ego↔slow, ego↔oncoming, slow↔oncoming)
#   - Near-miss: ego returns to own lane just in time
#
# Safety Constraints:
#   - min TTC: 2.0s (enforced)
#   - min distance: 5.0m (enforced)
#
# Run:
#   cargo run --release -- -i examples/head_on_near_miss.yaml -o output/
#
scenario_type: head_on

# Time configuration
time_step: 0.5
duration: 10.0

# 2-lane bidirectional road: lane 0 forward, lane 1 backward
road:
  num_lanes: 2
  lane_width: 3.5
  lane_directions: [1, -1]

# Actors
actors:
  - id: ego
    role: ego
    lane: 0                     # Forward lane
    position: 0.0               # Starting at x=0m
    speed: 12.0                 # 12 m/s forward
    direction: 1                # Forward (+x)
    acceleration: [-5.0, 3.0]
    lane_changes:
      # First: enter oncoming lane (overtake)
      - direction: right
        start_time: [1.5, 2.5]
        duration: [1.5, 2.0]
      # Second: return to own lane
      - direction: left
        start_time: [5.0, 6.0]
        duration: [1.5, 2.0]

  - id: slow_npc
    role: npc
    lane: 0                     # Same lane as ego (being overtaken)
    position: [30.0, 50.0]     # Ahead of ego
    speed: [6.0, 8.0]          # Slow vehicle motivating overtake
    direction: 1                # Forward (+x)
    acceleration: [-2.0, 1.0]
    behavior:
      # Hold the declared band for the whole horizon, not just at t=0.
      # Without this the "slow" vehicle reached 13.5 m/s -- 69% over its own
      # declared maximum, and faster than the ego's declared 12.0 -- so the
      # overtake was still enforced but its motivation had evaporated.
      speed_retention: 1.0

  - id: oncoming_npc
    role: npc
    lane: 1                     # Oncoming lane (backward traffic)
    position: [200.0, 220.0]   # Far enough to allow safe overtake
    speed: [10.0, 12.0]        # Oncoming speed
    direction: -1               # Backward (-x) - oncoming traffic
    acceleration: [-2.0, 1.0]
    behavior:
      # The closing speed is what makes this a head-on near miss, so the
      # oncoming car must keep its declared speed for the whole encounter.
      # Without this it coasted from 12.0 down to 4.1 m/s -- 41% of its
      # declared minimum -- and the near miss was bought by the oncoming
      # vehicle quietly getting out of the way.
      speed_retention: 1.0

# Lateral envelope.
#
# Until SW-09 `ay` was a free variable that no equation read, so this bound
# constrained nothing and the file solved at the 2.0 m/s2 default. Now that `ay`
# drives `vy`, the bound bites.
#
# SW-10 re-derived this number from scratch, as the SW-09 comment asked. The old
# note guessed it was "what a 3.5 m change in 1.5-2.0 s costs" and warned the
# figure might not survive. It does survive, but for a different reason: 3.0 is
# not an empirical fit, it is the exact minimum the discretisation admits.
#
#   `py` is pinned to a lane centre, with `vy = 0`, at the last step before the
#   change window and the first step after it. With time_step 0.5 s and the
#   window this file declares, those two pinned steps are 2.5 s apart -- five
#   intervals, four interior steps with a free `vy`.
#   Trapezoidal integration over those five intervals gives a lateral
#   displacement of 0.5 * (vy1 + vy2 + vy3 + vy4), which must equal one lane
#   width, 3.5 m, so vy1 + vy2 + vy3 + vy4 = 7.0.
#   The cartesian encoder caps |vy| at 2.0 m/s, so the two interior peaks
#   contribute at most 4.0 and the two ramp steps must supply the remaining 3.0
#   between them -- 1.5 m/s each, reached from vy = 0 in one 0.5 s step.
#   That is |ay| = 1.5 / 0.5 = 3.0 m/s2, and no profile does better.
#
# Bisected against the solver to confirm: UNSAT at 2.0, 2.5, 2.9 and 2.99,
# SAT at 3.0. The solved trajectory rides the bound exactly, with
# vy = 0, 1.5, 2.0, 2.0, 1.5, 0 across the window.
max_lateral_acceleration: 3.0

# Safety constraints - ENFORCE to maintain safety for all pairs
min_ttc: 2.0
min_distance: 5.0
num_scenarios: 1

constraint_modes:
  min_ttc: enforce
  min_distance: enforce

# Expected: Ego completes overtake safely, returning to own lane before oncoming gets close
